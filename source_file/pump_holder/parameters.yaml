  configuration_title: M3 x 16 mm / JT-500
  creator_name: Oomlout
  creator_url: https://github.com/oomlout
  credit: Documentation follows Oomlout's wave-drive assembly book and OOBB presentation
    conventions; the pump fit follows the supplied JT-500 dimension drawing.
  credit_url: https://github.com/oomlout/oomlout_oobb_part_motor_gearbox_wave_drive_version_5
  description: A 3D-printable JT-500 pump holder with a 5 x 5 OOBB base, two-wall
    clamp and captive-nut top cover. One print file contains all three pieces. The
    repository includes editable CAD source and illustrated assembly instructions.
  installation:
  - Check that the pump rear face rests on both retaining tongues and that the fins
    pass into the water openings.
  - Confirm that the top plate captures the pump, all nuts are seated, and the cable
    and outlet are free of pinching.
  - Use the exposed OOBB holes to attach the base to your structure. Choose those
    attachment fasteners for the mating structure; they are not included in the holder
    hardware count.
  - Keep the underside water openings clear when mounting the holder.
  - The cover presents six accessible M6 captive attachment nuts. Keep M6 screw projection
    below the cover face to at most 8 mm; the holes pass through the roof, so check
    that projecting bolts clear the pump. Attachment screws are not included in the
    inventory.
  notice: AI-generated CAD images and instructions. Errors possible.
  part_notes:
    base: Print one black base, plate face down and four feet up. The two inward tongues
      support the rear housing. The centre relief and upper/lower windows clear the
      rear projections and admit water. OOBB holes beneath the clamp and nut tabs
      are omitted. Four countersinks on the underside take the M3 x 16 mm clamp screws.
    lid: Print the black nut cover flat, with countersinks upward. It traps six M6
      attachment nuts in the upper roof pockets. Two M3 fixing nuts slide into lower
      side slots beneath solid shoulders. Two M3 x 16 mm countersunk screws secure
      it between the M6 rows within the plate. All top openings are circular.
    top: Print one teal clamp on the open side in the supplied orientation. The two
      walls connect the top plate to the local nut tabs. Slide four M3 nuts in from
      the outside edges. Route the outlet and cable through the two 15.5 mm openings
      before seating the clamp on the base.
  parts:
    base:
      id: oobb_holder_motor_pump_submersible_jt_500__base
      name: Retaining base
      printed: true
      quantity: 1
    capscrew:
