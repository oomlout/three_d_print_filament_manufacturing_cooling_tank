- assembly_instruction: Rotate the second identical print 180 degrees about its upright
    Y axis; join the flat faces at Z=0. Four M3 screws alternate direction across
    X. Position the assembled lifter in the middle of the lower gutter span, with
    both gutters extending past it in both directions. It is not an end closure. For
    installation, slide it along from an open end to that position before capping.
