    mm countersunk screws and nuts in the recessed pockets. Mount the two 4 mm feet
    to the inboard row of captive M6 nuts at 30 mm spacing. The inlet matches the
    holder's inward-facing outlet; the R40 bend directs the hose toward the visible
    edge.
